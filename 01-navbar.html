<!-- ============================================
     KESH AURA — NAVBAR
     File: sections/01-navbar.html
     Premium Navigation — $100K Quality
     ============================================ -->
<style>
  /* ==================
     NAVBAR — PREMIUM GLASSMORPHIC DESIGN
     ================== */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-height);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 clamp(24px, 5vw, 80px);
    transition: var(--transition-smooth);
  }

  .navbar.stuck {
    background: rgba(5, 5, 16, 0.85);
    backdrop-filter: var(--blur-glass);
    -webkit-backdrop-filter: var(--blur-glass);
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  }

  .navbar__wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: var(--container-max);
    margin: 0 auto;
  }

  /* ==================
     LOGO — REFINED BRANDING
     ================== */
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: var(--transition-fast);
  }

  .logo:hover {
    transform: translateY(-2px);
  }

  .logo__icon {
    width: 44px;
    height: 44px;
    background: var(--gradient-primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 20px;
    color: white;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
    position: relative;
  }

  .logo__icon::after {
    content: '';
    position: absolute;
    inset: -2px;
    background: var(--gradient-primary);
    border-radius: 14px;
    opacity: 0;
    filter: blur(8px);
    transition: var(--transition-fast);
    z-index: -1;
  }

  .logo:hover .logo__icon::after {
    opacity: 0.6;
  }

  .logo__text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .logo__name {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }

  .logo__tagline {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ==================
     NAVIGATION LINKS
     ================== */
  .nav__links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav__link {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    position: relative;
    padding: 8px 0;
    transition: var(--transition-fast);
  }

  .nav__link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--gradient-accent);
    transition: width 0.3s ease;
  }

  .nav__link:hover,
  .nav__link.active {
    color: var(--text-primary);
  }

  .nav__link:hover::after,
  .nav__link.active::after {
    width: 100%;
  }

  /* ==================
     CTA BUTTON — PREMIUM
     ================== */
  .nav__cta {
    padding: 12px 28px;
    background: var(--gradient-primary);
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    color: white;
    box-shadow: var(--shadow-btn);
    transition: var(--transition-smooth);
    position: relative;
    overflow: hidden;
  }

  .nav__cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 100%);
    opacity: 0;
    transition: var(--transition-fast);
  }

  .nav__cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
  }

  .nav__cta:hover::before {
    opacity: 1;
  }

  /* ==================
     MOBILE MENU
     ================== */
  .nav__burger {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 1001;
  }

  .nav__burger span {
    width: 26px;
    height: 2.5px;
    background: white;
    border-radius: 2px;
    transition: var(--transition-fast);
  }

  @media (max-width: 768px) {
    .nav__links {
      display: none;
      flex-direction: column;
      position: fixed;
      inset: 0;
      top: var(--nav-height);
      background: rgba(5, 5, 16, 0.98);
      backdrop-filter: var(--blur-glass);
      justify-content: center;
      align-items: center;
      gap: 32px;
      z-index: 999;
    }

    .nav__links.open {
      display: flex;
    }

    .nav__link {
      font-size: 1.25rem;
    }

    .nav__cta {
      font-size: 1.1rem;
      padding: 14px 36px;
    }

    .nav__burger {
      display: flex;
    }
  }
</style>

<nav class="navbar" id="navbar">
  <div class="navbar__wrapper">
    <!-- Logo -->
    <div class="logo">
      <div class="logo__icon">K</div>
      <div class="logo__text">
        <span class="logo__name">Kesh Aura</span>
        <span class="logo__tagline">Digital Agency</span>
      </div>
    </div>

    <!-- Navigation Links -->
    <ul class="nav__links" id="navLinks">
      <li><a href="#" class="nav__link active">Home</a></li>
      <li><a href="#services" class="nav__link">Services</a></li>
      <li><a href="#portfolio" class="nav__link">Portfolio</a></li>
      <li><a href="#contact" class="nav__link">Contact</a></li>
    </ul>

    <!-- CTA Button -->
    <a href="#contact" class="nav__cta">Start a Project</a>

    <!-- Mobile Burger -->
    <button class="nav__burger" id="burger" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
