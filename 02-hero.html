<!-- ============================================
     KESH AURA — HERO SECTION
     File: sections/02-hero.html
     Pixel-perfect match to reference screenshot
     ============================================ -->
<style>

  /* ==================
     HERO BACKGROUND LAYERS
     ================== */

  /* Diagonal light rays — exactly like screenshot */
  .hero-rays {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .hero-rays::before,
  .hero-rays::after {
    content: '';
    position: absolute;
    top: -50%;
    width: 1px;
    height: 200%;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(124, 58, 237, 0.12) 30%,
      rgba(124, 58, 237, 0.18) 50%,
      rgba(124, 58, 237, 0.12) 70%,
      transparent 100%
    );
    transform: rotate(35deg);
    transform-origin: top center;
  }

  .hero-rays::before { left: 30%; }
  .hero-rays::after  { left: 58%; }

  .hero-ray-3 {
    position: absolute;
    top: -50%;
    left: 75%;
    width: 1px;
    height: 200%;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(124, 58, 237, 0.10) 30%,
      rgba(124, 58, 237, 0.15) 50%,
      rgba(124, 58, 237, 0.10) 70%,
      transparent 100%
    );
    transform: rotate(35deg);
    transform-origin: top center;
    pointer-events: none;
    z-index: 0;
  }

  /* Top-right purple glow orb */
  .hero-orb-tr {
    position: absolute;
    top: -10%;
    right: -8%;
    width: 55%;
    height: 60%;
    background: radial-gradient(circle, rgba(88, 28, 220, 0.18) 0%, transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }

  /* Bottom-left subtle orb */
  .hero-orb-bl {
    position: absolute;
    bottom: -10%;
    left: -5%;
    width: 45%;
    height: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }

  /* Voxel dot grid */
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(124, 58, 237, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(124, 58, 237, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse 80% 80% at 60% 50%, black 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 60% 50%, black 40%, transparent 90%);
    pointer-events: none;
    z-index: 0;
  }

  /* ==================
     HERO MAIN
     ================== */
  .hero {
    min-height: 100vh;
    padding: var(--nav-height) clamp(24px, 5vw, 80px) 0;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero__container {
    max-width: var(--container-max);
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    align-items: center;
    position: relative;
    z-index: 1;
    min-height: calc(100vh - var(--nav-height));
  }

  /* ==================
     LEFT CONTENT
     ================== */
  .hero__content {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
    padding-bottom: var(--space-2xl);
    padding-top: var(--space-lg);
  }

  .hero__badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--font-size-xs);
    font-weight: 700;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 9px 20px;
    background: rgba(124, 58, 237, 0.08);
    border: 1px solid rgba(124, 58, 237, 0.28);
    border-radius: 50px;
    width: fit-content;
    backdrop-filter: blur(10px);
  }

  /* ==================
     GIANT TITLE — matches screenshot exactly
     ================== */
  .hero__title {
    font-family: var(--font-hero);
    font-size: clamp(3.8rem, 7.5vw, 7rem);
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }

  .hero__title--line1 {
    display: block;
    color: var(--text-primary);
  }

  /* "IMPACT" — white with subtle glow, matching screenshot */
  .hero__title--line2 {
    display: block;
    color: var(--text-primary);
    text-shadow:
      0 0 20px rgba(168, 85, 247, 0.35),
      0 10px 20px rgba(0,0,0,0.5);
  }

  .hero__subtitle {
    font-size: var(--font-size-lg);
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 460px;
    font-weight: 400;
  }

  /* ==================
     CTA BUTTONS
     ================== */
  .hero__cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn {
    padding: 16px 36px;
    border-radius: 50px;
    font-size: var(--font-size-base);
    font-weight: 600;
    transition: var(--transition-smooth);
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border: none;
    font-family: var(--font-main);
  }

  /* Pink-purple gradient button — exact match */
  .btn--primary {
    background: linear-gradient(135deg, #c026d3 0%, #a855f7 50%, #ec4899 100%);
    color: white;
    box-shadow: 0 4px 24px rgba(192, 38, 211, 0.45);
  }

  .btn--primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 36px rgba(192, 38, 211, 0.6);
  }

  /* Dark pill button */
  .btn--secondary {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(10px);
  }

  .btn--secondary:hover {
    border-color: rgba(124, 58, 237, 0.5);
    transform: translateY(-3px);
    background: rgba(124, 58, 237, 0.08);
  }

  /* ==================
     STATS BAR — bottom of left col
     ================== */
  .hero__stats {
    display: flex;
    gap: clamp(1.5rem, 4vw, 3rem);
    padding-top: var(--space-lg);
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    margin-top: auto;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat__value {
    font-family: var(--font-display);
    font-size: var(--font-size-2xl);
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
  }

  .stat__label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }

  /* ==================
     RIGHT SIDE — MASCOT ZONE
     ================== */
  .hero__visual {
    position: relative;
    height: 100vh;
    max-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: visible;
  }

  /* THE MASCOT — fills the entire right column height */
  .hero__mascot-wrap {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .hero__mascot {
    width: auto;
    height: 88vh;           /* Tall — fills the column like in screenshot */
    max-height: 820px;
    object-fit: contain;
    object-position: bottom center;
    display: block;
    filter:
      drop-shadow(0 0 60px rgba(124, 58, 237, 0.35))
      drop-shadow(0 30px 80px rgba(0, 0, 0, 0.6));
    animation: floatMascot 6s ease-in-out infinite;
    position: relative;
    z-index: 3;
  }

  @keyframes floatMascot {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-18px); }
  }

  /* ==================
     FLOATING METRIC CARDS
     ================== */
  .metric-cards {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .metric-card {
    position: absolute;
    background: rgba(12, 8, 30, 0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(124, 58, 237, 0.22);
    border-radius: 18px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: all;
    transition: var(--transition-smooth);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(124, 58, 237, 0.1) inset;
  }

  .metric-card:hover {
    transform: translateY(-6px) scale(1.04);
    border-color: rgba(124, 58, 237, 0.4);
    box-shadow:
      0 16px 48px rgba(124, 58, 237, 0.3),
      0 0 0 1px rgba(124, 58, 237, 0.2) inset;
  }

  .metric-card__icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* SVG icons — pure CSS, no libs */
  .metric-card__icon svg {
    width: 22px;
    height: 22px;
  }

  .metric-card__content {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .metric-card__value {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 800;
    line-height: 1;
    color: var(--text-primary);
  }

  .metric-card__label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* Card 1 — Social Reach — top right */
  .metric-card--1 {
    top: 10%;
    right: 2%;
    animation: floatCard1 4s ease-in-out infinite;
  }
  .metric-card--1 .metric-card__icon {
    background: rgba(124, 58, 237, 0.18);
  }

  /* Card 2 — ROI Boost — bottom right */
  .metric-card--2 {
    bottom: 14%;
    right: -2%;
    animation: floatCard2 5s ease-in-out infinite 0.8s;
  }
  .metric-card--2 .metric-card__icon {
    background: rgba(59, 130, 246, 0.18);
  }
  .metric-card--2 .metric-card__value {
    color: #60a5fa;
  }

  /* Card 3 — AI Driven — bottom left */
  .metric-card--3 {
    bottom: 12%;
    left: 2%;
    animation: floatCard3 4.5s ease-in-out infinite 1.2s;
  }
  .metric-card--3 .metric-card__icon {
    background: rgba(124, 58, 237, 0.18);
  }

  @keyframes floatCard1 {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-10px); }
  }
  @keyframes floatCard2 {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-8px); }
  }
  @keyframes floatCard3 {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-12px); }
  }

  /* ==================
     DECORATIVE FLOATING CUBES
     Scattered exactly like screenshot
     ================== */
  .deco-cube {
    position: absolute;
    border-radius: 4px;
    pointer-events: none;
    z-index: 5;
    animation: cubeSpin 8s linear infinite;
  }

  /* Top-right large purple cube */
  .deco-cube--1 {
    width: 22px;
    height: 22px;
    background: rgba(124, 58, 237, 0.55);
    box-shadow: 0 0 18px rgba(124, 58, 237, 0.5);
    top: 18%;
    right: 6%;
    animation-duration: 7s;
    animation-delay: 0s;
  }

  /* Right side small grey cube */
  .deco-cube--2 {
    width: 14px;
    height: 14px;
    background: rgba(180, 180, 200, 0.35);
    box-shadow: 0 0 10px rgba(180, 180, 200, 0.2);
    top: 42%;
    right: 0%;
    animation-duration: 9s;
    animation-delay: 1s;
  }

  /* Middle small blue cube */
  .deco-cube--3 {
    width: 16px;
    height: 16px;
    background: rgba(59, 130, 246, 0.6);
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
    bottom: 38%;
    left: 12%;
    animation-duration: 6s;
    animation-delay: 0.5s;
  }

  /* Bottom-right purple cube */
  .deco-cube--4 {
    width: 26px;
    height: 26px;
    background: rgba(124, 58, 237, 0.5);
    box-shadow: 0 0 22px rgba(124, 58, 237, 0.45);
    bottom: 4%;
    right: 8%;
    animation-duration: 8s;
    animation-delay: 2s;
  }

  @keyframes cubeSpin {
    0%   { transform: rotate(0deg) translateY(0px); }
    25%  { transform: rotate(15deg) translateY(-6px); }
    50%  { transform: rotate(0deg) translateY(-10px); }
    75%  { transform: rotate(-12deg) translateY(-4px); }
    100% { transform: rotate(0deg) translateY(0px); }
  }

  /* ==================
     RESPONSIVE
     ================== */
  @media (max-width: 1024px) {
    .hero__container {
      grid-template-columns: 1fr;
      min-height: auto;
    }

    .hero__visual {
      height: 500px;
      order: -1;
    }

    .hero__mascot {
      height: 480px;
    }

    .hero__content {
      text-align: center;
      align-items: center;
    }

    .hero__stats {
      justify-content: center;
    }
  }

  @media (max-width: 768px) {
    .hero {
      padding-top: var(--nav-height);
    }

    .hero__title {
      font-size: clamp(2.8rem, 11vw, 4.5rem);
    }

    .hero__subtitle {
      font-size: var(--font-size-base);
    }

    .hero__stats {
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    .metric-cards,
    .deco-cube {
      display: none;
    }

    .hero__mascot {
      height: 340px;
    }

    .btn {
      padding: 14px 28px;
      font-size: var(--font-size-sm);
    }
  }

</style>
